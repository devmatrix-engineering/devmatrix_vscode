name: Bug report
description: Something in the extension does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include Workshop API keys or other secrets. For security vulnerabilities, see SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Extensions view → DevMatrix → version.
      placeholder: "0.8.1"
    validations:
      required: true
  - type: input
    id: editor
    attributes:
      label: Editor and version
      placeholder: "VS Code 1.95.0 on Windows 11"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: 'Command Palette → "DevMatrix: Show Log". Remove anything confidential before pasting.'
      render: text
